name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir dist
          cp frontend/app.html dist/index.html
          cp frontend/manifest.webmanifest dist/manifest.webmanifest
          cp frontend/sw.js dist/sw.js
          cp -r frontend/icons dist/icons
          cp CNAME dist/CNAME
          # GitHub Pages serves a 404 for unknown paths; the app is a single page
          # with hash routing, so send everything to the app shell.
          cp frontend/app.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
